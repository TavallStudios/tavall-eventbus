version: 2

source:
  repository: TavallStudios/tavall-eventbus
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

artifacts:
  - name: tavall-eventbus
    path: build/libs/tavall-eventbus-*.jar
    channel: SNAPSHOT

requiredChecks:
  - compilation
  - unit-tests
  - quality
  - artifact

checks:
  compilation:
    executor: gradle
    tasks:
      - classes
  unit-tests:
    executor: gradle
    tasks:
      - test
  quality:
    executor: gradle
    tasks:
      - check
  artifact:
    executor: gradle
    tasks:
      - jar
