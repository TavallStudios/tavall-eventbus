version: 2

source:
  repository: TavallStudios/tavall-eventbus
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

artifacts:
  - name: tavall-eventbus
    path: build/tavall-ci-artifacts/tavall-eventbus.jar
    channel: SNAPSHOT

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - clean
      - check
      - assemble
      - tavallCiArtifact
